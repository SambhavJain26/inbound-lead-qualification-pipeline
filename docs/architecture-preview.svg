<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1050" viewBox="0 0 1750 1050"><rect width="1750" height="1050" fill="#fff"/><text x="80" y="90" font-family="Helvetica" font-size="30" fill="#1e1e1e" text-anchor="start" font-weight="bold">Automated Leasing &amp; Tenant Screening</text><text x="80" y="119" font-family="Helvetica" font-size="15" fill="#495057" text-anchor="start" >Green = real integration running today.   Amber = labelled mock.   Blue = the human decision.</text><text x="80" y="137.75" font-family="Helvetica" font-size="15" fill="#495057" text-anchor="start" >Grey beneath each box = what a production deployment puts there instead.</text><text x="182.5" y="195" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">1. Lead arrives</text><rect x="80" y="210" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="182.5" y="242" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Gmail (IMAP)</text><text x="182.5" y="259.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Zillow-format lead email</text><rect x="80" y="364" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="182.5" y="393" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >ILS feed or</text><text x="182.5" y="409.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Zillow Rental Manager</text><line x1="182.5" y1="326" x2="182.5" y2="356" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="291" y1="264" x2="323" y2="264" stroke="#495057" stroke-width="2" /><text x="431.5" y="195" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">2. Instant reply</text><rect x="329" y="210" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="431.5" y="242" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >OpenAI</text><text x="431.5" y="259.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >grounded in unit facts</text><text x="431.5" y="277" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >+ Tier A guardrails</text><rect x="329" y="364" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="431.5" y="393" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Same, plus SMS</text><text x="431.5" y="409.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >(A2P 10DLC registered)</text><line x1="431.5" y1="326" x2="431.5" y2="356" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="540" y1="264" x2="572" y2="264" stroke="#495057" stroke-width="2" /><text x="680.5" y="195" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">3. Pre-qualification</text><rect x="578" y="210" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="680.5" y="242" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Deterministic gate</text><text x="680.5" y="259.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >self-reported answers</text><rect x="578" y="364" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="680.5" y="393" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Same</text><line x1="680.5" y1="326" x2="680.5" y2="356" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="789" y1="264" x2="821" y2="264" stroke="#495057" stroke-width="2" /><text x="929.5" y="195" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">4. Tour</text><rect x="827" y="210" width="205" height="108" rx="6" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="929.5" y="242" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Cal.com booking</text><text x="929.5" y="259.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >+ entry code (MOCK)</text><rect x="827" y="364" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="929.5" y="393" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Rently / Tour24</text><text x="929.5" y="409.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >real smart lock</text><line x1="929.5" y1="326" x2="929.5" y2="356" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="1038" y1="264" x2="1070" y2="264" stroke="#495057" stroke-width="2" /><text x="1178.5" y="195" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">5. Application</text><rect x="1076" y="210" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1178.5" y="242" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >n8n Form</text><text x="1178.5" y="259.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >+ document upload</text><rect x="1076" y="364" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="1178.5" y="393" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >PMS application</text><text x="1178.5" y="409.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >or hosted form</text><line x1="1178.5" y1="326" x2="1178.5" y2="356" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="1287" y1="264" x2="1319" y2="264" stroke="#495057" stroke-width="2" /><text x="1427.5" y="195" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">6. Document read</text><rect x="1325" y="210" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1427.5" y="242" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >OpenAI extraction</text><text x="1427.5" y="259.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >every value cited</text><rect x="1325" y="364" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="1427.5" y="393" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Same</text><line x1="1427.5" y1="326" x2="1427.5" y2="356" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><text x="182.5" y="495" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">7. Income verified</text><rect x="80" y="510" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="182.5" y="542" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >PLAID SANDBOX</text><text x="182.5" y="559.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >real API, test data</text><rect x="80" y="664" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="182.5" y="693" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Plaid Production</text><text x="182.5" y="709.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >+ Hosted Link</text><line x1="182.5" y1="626" x2="182.5" y2="656" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="291" y1="564" x2="323" y2="564" stroke="#495057" stroke-width="2" /><text x="431.5" y="495" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">8. Background check</text><rect x="329" y="510" width="205" height="108" rx="6" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="431.5" y="542" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Screening Bureau</text><text x="431.5" y="559.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >(MOCK)</text><text x="431.5" y="577" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >ShareAble v3 shape</text><rect x="329" y="664" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="431.5" y="693" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >TransUnion ShareAble</text><text x="431.5" y="709.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >FCRA credentialing</text><line x1="431.5" y1="626" x2="431.5" y2="656" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="540" y1="564" x2="572" y2="564" stroke="#495057" stroke-width="2" /><text x="680.5" y="495" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">9. Criteria applied</text><rect x="578" y="510" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="680.5" y="542" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Deterministic engine</text><text x="680.5" y="559.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >manager thresholds</text><text x="680.5" y="577" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >evidence per criterion</text><rect x="578" y="664" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="680.5" y="693" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Same</text><line x1="680.5" y1="626" x2="680.5" y2="656" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="789" y1="564" x2="821" y2="564" stroke="#495057" stroke-width="2" /><text x="929.5" y="495" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">10. Human decides</text><rect x="827" y="510" width="205" height="108" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="929.5" y="542" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Telegram card</text><text x="929.5" y="559.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Approve / Conditional</text><text x="929.5" y="577" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >/ Review</text><rect x="827" y="664" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="929.5" y="693" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Same, or in-PMS</text><text x="929.5" y="709.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >approval queue</text><line x1="929.5" y1="626" x2="929.5" y2="656" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="1038" y1="564" x2="1070" y2="564" stroke="#495057" stroke-width="2" /><text x="1178.5" y="495" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">11. Lease signed</text><rect x="1076" y="510" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1178.5" y="542" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >DocuSign sandbox</text><text x="1178.5" y="559.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >watermarked</text><rect x="1076" y="664" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="1178.5" y="693" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >DocuSign production</text><text x="1178.5" y="709.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >(paid plan)</text><line x1="1178.5" y1="626" x2="1178.5" y2="656" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><line x1="1287" y1="564" x2="1319" y2="564" stroke="#495057" stroke-width="2" /><text x="1427.5" y="495" font-family="Helvetica" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="bold">12. Unit leased</text><rect x="1325" y="510" width="205" height="108" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1427.5" y="542" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >Postgres</text><text x="1427.5" y="559.5" font-family="Helvetica" font-size="14" fill="#1e1e1e" text-anchor="middle" >+ welcome packet</text><rect x="1325" y="664" width="205" height="74" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="1427.5" y="693" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Yardi / AppFolio /</text><text x="1427.5" y="709.25" font-family="Helvetica" font-size="13" fill="#495057" text-anchor="middle" >Entrata</text><line x1="1427.5" y1="626" x2="1427.5" y2="656" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/><text x="1427.5" y="463" font-family="Helvetica" font-size="13" fill="#868e96" text-anchor="middle" >continues below</text><rect x="80" y="818" width="1450" height="150" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><text x="100" y="852" font-family="Helvetica" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="bold">What the system never does</text><text x="100" y="882" font-family="Helvetica" font-size="14" fill="#343a40" text-anchor="start" >It never decides.  The AI reads documents and answers questions; a deterministic engine applies the manager's published criteria; a person makes every rental decision.</text><text x="100" y="899.5" font-family="Helvetica" font-size="14" fill="#343a40" text-anchor="start" >It never scores or ranks an applicant, and never infers anything about a protected class.</text><text x="100" y="917" font-family="Helvetica" font-size="14" fill="#343a40" text-anchor="start" >It never sends a denial.  A file that fails criteria stops and hands to a human - real adverse action is a formal FCRA process, and automating it is how operators end up in class actions.</text></svg>